name: Weekly Price Scraper

on:
  # Trigger semua 3 hari (Jum/Sab/Min), tapi hanya 1 yang benar-benar jalan per minggu
  # Guard step di bawah yang menentukan hari mana yang dipilih minggu ini
  schedule:
    - cron: '0 17 * * 5'  # Jumat  17:00 UTC = 00:00 WIB
    - cron: '0 17 * * 6'  # Sabtu  17:00 UTC = 00:00 WIB
    - cron: '0 17 * * 0'  # Minggu 17:00 UTC = 00:00 WIB

  # Bisa di-trigger manual dari GitHub Actions UI untuk testing
  workflow_dispatch:
    inputs:
      limit:
        description: 'Jumlah produk yang di-scrape (kosongkan = semua produk)'
        required: false
        default: ''
      skip_day_guard:
        description: 'Skip pengecekan hari (untuk testing manual)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    name: Scrape Alfagift Weekly Prices
    runs-on: ubuntu-latest
    timeout-minutes: 300  # Maksimal 5 jam (scrape semua produk bisa lama)

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Asia/Jakarta

    steps:
      # ─────────────────────────────────────────
      # 1. Checkout repo
      # ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Setup Python
      # ─────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # ─────────────────────────────────────────
      # 3. Install Python dependencies
      # ─────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
        working-directory: .

      # ─────────────────────────────────────────
      # 4. Install Playwright + Chromium
      # ─────────────────────────────────────────
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ─────────────────────────────────────────
      # 5. Guard: hanya jalan 1 hari per minggu
      #    Rotasi berdasarkan ISO week number % 3
      #    0 = Jumat (weekday 5)
      #    1 = Sabtu (weekday 6)
      #    2 = Minggu (weekday 7)
      # ─────────────────────────────────────────
      - name: Check if today is the selected scrape day
        id: day_guard
        run: |
          SKIP_GUARD="${{ github.event.inputs.skip_day_guard || 'false' }}"
          if [[ "$SKIP_GUARD" == "true" ]]; then
            echo "Guard skipped (manual trigger)."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ISO week number (1–53), hilangkan leading zero
          ISO_WEEK=$(date +%V | sed 's/^0*//')
          if [[ -z "$ISO_WEEK" ]]; then
            ISO_WEEK=1
          fi

          DAY_INDEX=$(( ISO_WEEK % 3 ))   # 0, 1, atau 2
          TODAY=$(date +%u)               # 5=Jum, 6=Sab, 7=Min

          # Tentukan hari target berdasarkan index
          if [[ $DAY_INDEX -eq 0 ]]; then
            TARGET_DAY=5
            TARGET_NAME="Jumat"
          elif [[ $DAY_INDEX -eq 1 ]]; then
            TARGET_DAY=6
            TARGET_NAME="Sabtu"
          else
            TARGET_DAY=7
            TARGET_NAME="Minggu"
          fi

          echo "ISO Week   : $ISO_WEEK"
          echo "Day Index  : $DAY_INDEX"
          echo "Today      : $TODAY"
          echo "Target Day : $TARGET_DAY ($TARGET_NAME)"

          if [[ "$TODAY" == "$TARGET_DAY" ]]; then
            echo "✅ Hari ini adalah hari scraping terpilih ($TARGET_NAME). Lanjut."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Hari ini bukan hari scraping minggu ini ($TARGET_NAME). Skip."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      # ─────────────────────────────────────────
      # 6. Random sleep untuk stealth
      #    0–7200 detik = 0–2 jam
      # ─────────────────────────────────────────
      - name: Random delay before scraping (stealth)
        if: steps.day_guard.outputs.should_run == 'true'
        run: |
          SLEEP_SEC=$(( RANDOM % 7200 ))
          echo "💤 Tidur dulu ${SLEEP_SEC} detik sebelum mulai scraping..."
          sleep $SLEEP_SEC

      # ─────────────────────────────────────────
      # 7. Jalankan scraper
      # ─────────────────────────────────────────
      - name: Run Alfagift price scraper
        if: steps.day_guard.outputs.should_run == 'true'
        run: |
          LIMIT_ARG=""
          if [[ -n "${{ github.event.inputs.limit }}" ]]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
            echo "🔢 Scraping dengan limit: ${{ github.event.inputs.limit }} produk"
          else
            echo "🚀 Scraping semua produk..."
          fi

          python backend/scripts/scrape_alfagift_automated.py --now $LIMIT_ARG \
            --log-level INFO \
            --headless \
            --delay-min 3.0 \
            --delay-max 7.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ─────────────────────────────────────────
      # 8. Summary
      # ─────────────────────────────────────────
      - name: Print run summary
        if: always()
        run: |
          if [[ "${{ steps.day_guard.outputs.should_run }}" == "true" ]]; then
            echo "## ✅ Scraping selesai" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Tanggal**: $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
            echo "- **ISO Week**: $(date +%V)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⏭️ Hari ini bukan hari scraping" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Workflow di-skip. Cek kembali Jumat/Sabtu/Minggu berikutnya." >> $GITHUB_STEP_SUMMARY
          fi
